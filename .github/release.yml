# Categories for generated release notes (used when a release has no docs/RELEASE-<version>.md).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Engines
      labels:
        - engines
    - title: Platforms
      labels:
        - windows
        - macos
        - linux
        - packaging
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
